<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D1D2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life Tracker">
<title>Life Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<style>
:root {
  --bg: #1D1D2B; --panel: #24243A; --panel2: #2F2F46; --line: #3E3E57; --edge: #E8E5F2; --empty: #3A3A50;
  --ink: #EDEBF5; --muted: #B4B1C6; --soft: #D9D6E8;
  --gold: #F2C66D; --mint: #8FE0B0; --blue: #7FB4F0; --red: #FF8A7A; --grey: #B4B1C6;
  --serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  --tabh: 84px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.4 Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-variant-numeric: tabular-nums;
  -webkit-text-size-adjust: 100%; overscroll-behavior-y: none; }
b { font-weight: 600; color: var(--ink); }
button { font: inherit; color: inherit; cursor: pointer; border-radius: 0; }
button:active { transform: translate(1px, 1px); }
input, select { font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 0; }
input:focus, select:focus { outline: none; border-color: var(--gold); }

#screen { padding: calc(env(safe-area-inset-top) + 16px) 16px calc(var(--tabh) + env(safe-area-inset-bottom) + 96px);
  display: flex; flex-direction: column; gap: 12px; max-width: 520px; margin: 0 auto; }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
.head .sub { font-size: 13px; color: var(--muted); }
.head h1 { margin: 0; font-family: var(--serif); font-size: 34px; line-height: 40px; font-weight: 600; letter-spacing: -0.01em; }
.iconbtn { width: 44px; height: 44px; border: 2px solid var(--line); background: transparent; display: flex; align-items: center; justify-content: center; color: var(--muted); }

.card { display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 2px solid var(--line); background: var(--panel); }
.card.strong { border-color: var(--edge); box-shadow: 4px 4px 0 #0E0E17; }
.card.tap { cursor: pointer; }
.lbl { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.lbl > span:first-child { font-size: 13px; color: var(--muted); }
.lbl > span:last-child { font-size: 12px; color: var(--muted); text-align: right; }
.big { font-size: 26px; line-height: 30px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
.big small { font-size: 13px; font-weight: 400; color: var(--muted); }
.note { font-size: 12px; line-height: 16px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; line-height: 18px; }
.blocks { display: flex; gap: 3px; }
.blocks i { flex: 1; height: 10px; background: var(--empty); }
.blocks.sq i { flex: none; width: 14px; height: 14px; }
.c-gold { color: var(--gold); } .c-mint { color: var(--mint); } .c-red { color: var(--red); } .c-blue { color: var(--blue); } .c-muted { color: var(--muted); }

.say { display: flex; gap: 12px; align-items: flex-start; }
.faces { display: flex; flex-direction: column; gap: 4px; flex: none; }
.faces span { display: flex; padding: 2px; background: #33334A; }
.say .txt { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.say .who { font-size: 12px; font-weight: 600; }
.say .headline { font-family: var(--serif); font-size: 18px; line-height: 24px; font-weight: 600; }
.say p { margin: 0; font-size: 13px; line-height: 19px; color: var(--soft); }

.item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-top: 2px solid var(--panel2); cursor: pointer; }
.item .t { font-size: 14px; line-height: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .s { font-size: 12px; line-height: 16px; color: var(--muted); }
.item .a { font-size: 14px; font-weight: 600; white-space: nowrap; }
.pocket { display: flex; flex-direction: column; gap: 5px; padding: 10px 0; border-top: 2px solid var(--panel2); }
.hbar { display: flex; align-items: center; gap: 10px; font-size: 13px; line-height: 18px; }
.hbar .n { width: 92px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .b { flex: 1; height: 10px; background: var(--empty); } .hbar .b i { display: block; height: 10px; background: var(--blue); }
.hbar .v { width: 84px; text-align: right; color: var(--muted); }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 8px 12px; min-height: 40px; border: 2px solid var(--line); background: transparent; color: var(--muted); font-size: 14px; font-weight: 600; }
.chip.on { background: var(--gold); color: var(--bg); border-color: var(--edge); }
.btn { height: 52px; border: 2px solid var(--edge); background: transparent; color: var(--ink); font-size: 16px; font-weight: 600; padding: 0 16px; }
.btn.primary { background: var(--gold); color: var(--bg); box-shadow: 4px 4px 0 #0E0E17; }
.btn.danger { border-color: var(--red); color: var(--red); }
.btn.small { height: 40px; font-size: 14px; }

.due { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; border: 2px dashed var(--gold); background: var(--panel); }
.due .t { font-size: 14px; } .due .s { font-size: 12px; color: var(--muted); }
.due .acts { display: flex; gap: 6px; flex: none; }

/* floor with cats */
.floor { position: fixed; left: 0; right: 0; bottom: calc(var(--tabh) + env(safe-area-inset-bottom)); height: 84px; background: var(--panel); border-top: 4px solid var(--empty); z-index: 1; }
.floor .cat { position: absolute; bottom: 6px; display: flex; cursor: pointer; }
.fa { animation: fa 1.6s steps(1) infinite; } .fb { opacity: 0; animation: fb 1.6s steps(1) infinite; }
@keyframes fa { 0%, 49.99% { opacity: 1 } 50%, 100% { opacity: 0 } }
@keyframes fb { 0%, 49.99% { opacity: 0 } 50%, 100% { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .fa, .fb { animation: none } .fb { opacity: 0 } }

/* tab bar + add button */
#tabs { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--tabh) + env(safe-area-inset-bottom)); padding: 0 8px env(safe-area-inset-bottom);
  display: flex; background: #17172A; border-top: 2px solid var(--empty); z-index: 3; }
#tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 8px; border: 0; border-top: 3px solid transparent;
  background: transparent; color: var(--muted); font-size: 12px; font-weight: 500; }
#tabs button.on { color: var(--gold); border-top-color: var(--gold); font-weight: 600; }
#fab { position: fixed; right: 20px; bottom: calc(var(--tabh) + env(safe-area-inset-bottom) + 16px); width: 56px; height: 56px; z-index: 4;
  border: 2px solid var(--edge); background: var(--gold); color: var(--bg); font-size: 32px; line-height: 1; font-weight: 600; box-shadow: 4px 4px 0 #0E0E17; }

/* sheets */
.overlay { position: fixed; inset: 0; background: #000b; display: none; align-items: flex-end; justify-content: center; z-index: 10; }
.overlay.open { display: flex; }
.sheet { width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; background: var(--panel); border-top: 2px solid var(--edge);
  padding: 18px 16px calc(env(safe-area-inset-bottom) + 18px); display: flex; flex-direction: column; gap: 14px; }
.sheet h3 { margin: 0; font-family: var(--serif); font-size: 22px; line-height: 28px; font-weight: 600; }
.sheet .msg { margin: 0; color: var(--soft); white-space: pre-line; font-size: 14px; line-height: 20px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 12px; color: var(--muted); }
.field input, .field select { height: 48px; padding: 0 12px; width: 100%; }
.amount { display: flex; align-items: center; gap: 8px; border-bottom: 2px solid var(--line); padding-bottom: 6px; }
.amount span { font-size: 28px; font-weight: 600; color: var(--muted); }
.amount input { border: 0; background: transparent; font-size: 36px; font-weight: 600; width: 100%; padding: 0; height: 48px; }
.err { color: var(--red); font-size: 13px; white-space: pre-line; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.week { display: flex; justify-content: space-between; }
.day { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
.day i { width: 32px; height: 32px; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; font-style: normal; font-weight: 700; color: var(--bg); }
.day.done i { background: var(--mint); border-color: var(--mint); }
.day.today i { border-color: var(--edge); }
.day.today:not(.done) i { background: var(--panel2); }
.herobox { display: flex; justify-content: center; gap: 4px; padding: 6px 0; background: var(--bg); }
.mrow { display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 18px; }
.mrow i { width: 12px; height: 12px; flex: none; }
.mrow span:nth-child(2) { flex: 1; } .mrow span:last-child { color: var(--muted); }
.tag { padding: 2px 6px; background: var(--gold); color: var(--bg); font-size: 11px; line-height: 14px; font-weight: 700; white-space: nowrap; }
.step { width: 48px; height: 48px; border: 2px solid var(--line); background: transparent; font-size: 22px; }
.step.plus { border-color: var(--edge); background: var(--blue); color: var(--bg); font-weight: 700; }
svg { display: block; flex: none; }
#banner { display: none; background: #5A2430; color: #fff; padding: 12px; font-weight: 600; font-size: 14px; border: 2px solid var(--red); }
#toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 12px); transform: translateX(-50%); z-index: 20;
  background: #0E0E17; border: 2px solid var(--edge); color: var(--ink); padding: 10px 16px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; text-align: center; }
#toast.show { opacity: 1; }
.empty { text-align: center; color: var(--muted); font-size: 13px; padding: 10px 0; }
</style>
</head>
<body>
<main id="screen"></main>
<div id="floor"></div>
<button id="fab" aria-label="Add">+</button>
<nav id="tabs"></nav>
<div class="overlay" id="sheet"><div class="sheet" id="sheetBody"></div></div>
<div class="overlay" id="dialog"><div class="sheet">

</div></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<div id="toast"></div>

// Upgrades older saves without losing anything
function migrate(obj) {
  if (!obj || typeof obj !== 'object') throw new Error('Not a Life Tracker save');
  if ((obj.schemaVersion || 0) > SCHEMA_VERSION) throw new Error('This backup is from a newer version of the app');
  const base = defaultData();
  const out = { ...base, ...obj, settings: { ...base.settings, ...(obj.settings || {}) } };
  out.settings.ai = { ...base.settings.ai, ...((obj.settings || {}).ai || {}) };
  for (const key of COLLECTIONS) if (!Array.isArray(out[key])) out[key] = base[key];
  if ((obj.schemaVersion || 1) < 2) {
    // v1 → v2: add pockets, new categories, give each old expense a pocket, add salary/kosan/invest reminders
    out.pockets = base.pockets;
    const have = new Set(out.categories.map(c => c.id));
    for (const c of base.categories) if (!have.has(c.id)) out.categories.push(c);
    for (const c of out.categories) {
      const def = base.categories.find(b => b.id === c.id);
      if (c.type === 'expense' && !c.pocketId) c.pocketId = def ? def.pocketId : 'pk_basic';
      if (c.type === 'income') c.pocketId = null;
      delete c.emoji;
    }
    for (const t of out.transactions) {
      if (t.type !== 'income' && !t.pocketId) t.pocketId = (out.categories.find(c => c.id === t.categoryId) || {}).pocketId || 'pk_basic';
      if (t.type === 'income') t.pocketId = null;
    }
    if (!out.recurring.length) out.recurring = base.recurring;
  }
  if (!out.water || typeof out.water !== 'object' || Array.isArray(out.water)) out.water = {};
  out.schemaVersion = SCHEMA_VERSION;
  return out;
}
function validateBackup(obj) {
  if (!obj || typeof obj !== 'object') return 'File is not a Life Tracker backup.';
  if (typeof obj.schemaVersion !== 'number') return 'File is missing the version number — not a Life Tracker backup.';
  for (const key of ['categories', 'transactions', 'workouts', 'weights']) if (!Array.isArray(obj[key])) return `Backup is missing "${key}".`;
  if (obj.schemaVersion > SCHEMA_VERSION) return 'This backup is from a newer version of the app.';
  return null;
}

/* =========================================================
   4. STORAGE — save on every change, keep the previous save
   ========================================================= */
let data;
function load() {
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); }
  catch (e) { data = defaultData(); showBanner('⚠️ This browser is blocking storage. Nothing will be saved. Open the app from the Home Screen icon.'); return; }
  if (!raw) { data = defaultData(); save(); return; }
  try {
    const parsed = JSON.parse(raw);
    const wasOld = (parsed.schemaVersion || 1) < SCHEMA_VERSION;
    data = migrate(parsed);
    if (wasOld) save();
  } catch (e) {
    try { data = migrate(JSON.parse(localStorage.getItem(PREVIOUS_KEY))); showBanner('Main save was unreadable, so the previous save was restored.'); save(); }
    catch (e2) { data = defaultData(); data.__doNotOverwrite = true; showBanner('⚠️ Saved data could not be read. Restore from a backup file in Settings. (Nothing was overwritten yet.)'); }
  }
}
function save() {
  if (data.__doNotOverwrite) delete data.__doNotOverwrite;
  data.updatedAt = new Date().toISOString();
  try {
    const current = localStorage.getItem(STORAGE_KEY);
    if (current) localStorage.setItem(PREVIOUS_KEY, current);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return true;
  } catch (e) { showBanner('⚠️ Could not save! Storage may be full. Export a backup now (Settings).'); return false; }
}
let persisted = null;
async function askPersistentStorage() {
  try { if (navigator.storage && navigator.storage.persist) return (await navigator.storage.persisted()) || (await navigator.storage.persist()); } catch (e) {}
  return null;
}

/* =========================================================
   5. VALIDATION — errors block saving, warnings ask first
   ========================================================= */
function validateTransaction(t, d = data) {
  const errors = [], warnings = [];
  if (!['expense', 'income', 'refund'].includes(t.type)) errors.push('Type must be expense, income or refund.');
  if (typeof t.amount !== 'number' || !Number.isFinite(t.amount)) errors.push('Enter an amount.');
  else {
    if (t.amount <= 0) errors.push('Amount must be more than 0. For money back, use "Refund".');
    else if (!Number.isInteger(t.amount)) errors.push('Rupiah amounts have no decimals.');
    if (t.amount > 1e11) errors.push('Amount looks too large.');
  }
  const cat = d.categories.find(c => c.id === t.categoryId);
  if (!cat) errors.push('Pick a category.');
  else if (cat.type !== (t.type === 'income' ? 'income' : 'expense')) errors.push(`"${cat.name}" is not an ${t.type === 'income' ? 'income' : 'expense'} category.`);
  if (t.type !== 'income' && !d.pockets.find(p => p.id === t.pocketId)) errors.push('Pick a pocket.');
  if (!isValidDateStr(t.date)) errors.push('Date is not valid.');
  else if (t.date > todayStr()) warnings.push('This date is in the future.');
  if (t.note && t.note.length > 200) errors.push('Note is too long (max 200 characters).');
  if (!errors.length && t.type === 'expense' && t.amount >= 5000000) warnings.push(`${formatIDR(t.amount)} is a big amount. Is it right?`);
  return { errors, warnings };
}
function validateWorkout(w, d = data) {
  const errors = [], warnings = [];
  if (!d.workoutTypes.find(x => x.id === w.typeId)) errors.push('Pick a workout type.');
  if (!Number.isInteger(w.durationMin) || w.durationMin < 1 || w.durationMin > 600) errors.push('Duration must be 1–600 minutes.');
  if (!isValidDateStr(w.date)) errors.push('Date is not valid.'); else if (w.date > todayStr()) warnings.push('This workout date is in the future.');
  return { errors, warnings };
}
function validateWeight(x) {
  const errors = [], warnings = [];
  if (typeof x.kg !== 'number' || !Number.isFinite(x.kg) || x.kg < 20 || x.kg > 350) errors.push('Weight must be between 20 and 350 kg.');
  if (!isValidDateStr(x.date)) errors.push('Date is not valid.'); else if (x.date > todayStr()) warnings.push('This date is in the future.');
  return { errors, warnings };
}
const VALIDATORS = { transactions: validateTransaction, workouts: validateWorkout, weights: validateWeight };

/* =========================================================
   6. ACTIONS — the only functions that change data
   ========================================================= */
function addRecord(collection, record, { force = false } = {}) {
  const check = VALIDATORS[collection](record);
  if (check.errors.length) return { ok: false, ...check };
  if (check.warnings.length && !force) return { ok: false, needsConfirm: true, ...check };
  const full = { id: uid(), createdAt: new Date().toISOString(), ...record };
  data[collection].push(full);
  if (record.recurringId) { const r = data.recurring.find(x => x.id === record.recurringId); if (r) r.lastDoneMonth = record.date.slice(0, 7); }
  if (!save()) { data[collection].pop(); return { ok: false, errors: ['Save failed.'], warnings: [] }; }
  return { ok: true, record: full, errors: [], warnings: [] };
}
function deleteRecord(collection, id) {
  const i = data[collection].findIndex(r => r.id === id);
  if (i < 0) return false;
  const [removed] = data[collection].splice(i, 1);
  if (!save()) { data[collection].splice(i, 0, removed); return false; }
  return true;
}
function skipRecurring(id, ym) { const r = data.recurring.find(x => x.id === id); if (!r) return; r.lastDoneMonth = ym; save(); }

/* =========================================================
   7. CALCULATIONS
   ========================================================= */
const pocketOf = id => data.pockets.find(p => p.id === id);
const catOf = id => data.categories.find(c => c.id === id);
function signed(t) { return t.type === 'refund' ? -t.amount : t.amount; }

function monthStats(ym = todayStr().slice(0, 7)) {
  let income = 0, spent = 0, saved = 0;
  const byPocket = {}, byCat = {};
  for (const p of data.pockets) byPocket[p.id] = 0;
  for (const t of data.transactions) {
    if (!t.date.startsWith(ym)) continue;
    if (t.type === 'income') { income += t.amount; continue; }
    const v = signed(t), p = pocketOf(t.pocketId);
    byPocket[t.pocketId] = (byPocket[t.pocketId] || 0) + v;
    if (p && p.kind === 'save') saved += v;
    else { spent += v; byCat[t.categoryId] = (byCat[t.categoryId] || 0) + v; }
  }
  return { income, spent, saved, left: income - spent - saved, byPocket, byCat };
}
function rangeSpent(from, to) { // spending (not savings) between two date strings, inclusive
  let s = 0, n = 0;
  for (const t of data.transactions) {
    if (t.type === 'income' || t.date < from || t.date > to) continue;
    const p = pocketOf(t.pocketId); if (p && p.kind === 'save') continue;
    s += signed(t); n++;
  }
  return { spent: s, count: n };
}
// Daily allowance = what is left in the spend pockets (Basic + Foya-Foya) at the start of today ÷ days left (incl. today)
function dailyPace(today = todayStr()) {
  const ym = today.slice(0, 7), d = parseDate(today);
  const daysLeft = daysInMonth(d.getFullYear(), d.getMonth()) - d.getDate() + 1;
  let budget = 0, spentBefore = 0;
  for (const p of data.pockets) if (p.kind === 'spend') budget += p.budget;
  for (const t of data.transactions) {
    if (t.type === 'income' || !t.date.startsWith(ym) || t.date >= today) continue;
    const p = pocketOf(t.pocketId); if (p && p.kind === 'spend') spentBefore += signed(t);
  }
  return { pace: Math.max(0, Math.round((budget - spentBefore) / daysLeft)), daysLeft };
}
function pocketStatus(p, st) {
  const used = st.byPocket[p.id] || 0, pct = p.budget ? Math.round(used / p.budget * 100) : 0;
  const warn = data.settings.budgetWarningPct;
  return { used, left: p.budget - used, pct, level: pct >= 100 ? 'over' : pct >= warn ? 'warn' : 'ok' };
}
function dueDate(r, ym) {
  const [y, m] = ym.split('-').map(Number);
  if (r.schedule.kind === 'lastWorkingDay') return lastWorkingDay(y, m - 1);
  return ym + '-' + String(Math.min(r.schedule.day, daysInMonth(y, m - 1))).padStart(2, '0');
}
function dueItems(today = todayStr()) {
  const ym = today.slice(0, 7);
  return data.recurring.filter(r => r.active && r.lastDoneMonth !== ym && dueDate(r, ym) <= today).map(r => ({ r, date: dueDate(r, ym) }));
}
function nextPayday(today = todayStr()) {
  const d = parseDate(today); let p = lastWorkingDay(d.getFullYear(), d.getMonth());
  if (p < today) p = lastWorkingDay(d.getFullYear(), d.getMonth() + 1);
  return { date: p, days: Math.round((parseDate(p) - parseDate(today)) / 864e5) };
}
function workoutsThisWeek() {
  const from = todayStr(weekStart()), to = todayStr();
  return new Set(data.workouts.filter(w => w.date >= from && w.date <= to).map(w => w.date)).size;
}

/* =========================================================
   8. LILY & LILO — free, rule-based narrative summaries
   Format: headline, 2–3 key points with bold numbers, one next step.
   ========================================================= */
function spendPocketsWorst(st) {
  return data.pockets.filter(p => p.kind === 'spend').map(p => ({ p, ...pocketStatus(p, st) })).sort((a, b) => b.pct - a.pct)[0];
}
function lilyMonth() {
  const st = monthStats(), today = todayStr(), { pace, daysLeft } = dailyPace(), basic = pocketOf('pk_basic');
  const worst = spendPocketsWorst(st), pts = [];
  if (basic) { const b = pocketStatus(basic, st); pts.push(`${esc(basic.name)} has <b>${formatIDR(b.left)}</b> left for <b>${daysLeft} days</b>, about <b>${formatIDR(Math.max(0, b.left) / daysLeft)}</b> a day.`); }
  const top = Object.entries(st.byCat).filter(([id]) => { const p = pocketOf(catOf(id).pocketId); return !p || p.kind === 'spend'; }).sort((a, b) => b[1] - a[1])[0];
  if (top && top[1] > 0) pts.push(`Top spend is <b>${esc(catOf(top[0]).name)}</b> at <b>${formatIDR(top[1])}</b>.`);
  const rent = pocketOf('pk_rent');
  if (rent) { const r = pocketStatus(rent, st); if (r.used > rent.budget) pts.push(`${esc(rent.name)} came in at <b>${formatIDR(r.used)}</b>, <b>${formatIDR(r.used - rent.budget)}</b> over.`); }
  let head, next;
  if (!data.transactions.some(t => t.date.startsWith(today.slice(0, 7)))) { head = 'A fresh month. Log your first expense.'; next = 'Tap <b>+</b> after your next purchase. It takes 10 seconds.'; }
  else if (worst && worst.level === 'over') { head = `${worst.p.name} is over budget.`; next = `Pause ${esc(worst.p.name)} spending, or move money from another pocket.`; }
  else if (worst && worst.level === 'warn') { head = `${worst.p.name} is at ${worst.pct}%. Time to slow down.`; next = `Keep ${esc(worst.p.name)} under <b>${formatIDR(Math.max(0, worst.left))}</b> until the month ends.`; }
  else { head = 'On track this month.'; next = `Basic and Foya-Foya together allow <b>${formatIDR(pace)}</b> a day. Stay under it and every pocket ends in the green.`; }
  return { head, pts: pts.slice(0, 3), next };
}
function homeSummary() {
  const today = todayStr(), { spent } = rangeSpent(today, today), { pace } = dailyPace(), st = monthStats(), worst = spendPocketsWorst(st);
  const w = workoutsThisWeek(), target = data.settings.weeklyWorkoutTarget, due = dueItems();
  const lily = spent === 0 ? `Nothing spent yet today. You can spend up to <b>${formatIDR(pace)}</b> (Basic + Foya-Foya).`
    : spent <= pace ? `Spent <b>${formatIDR(spent)}</b> today, under the <b>${formatIDR(pace)}</b> daily pace.`
    : `Spent <b>${formatIDR(spent)}</b> today, <b>${formatIDR(spent - pace)}</b> over the daily pace.`;
  const lilyExtra = worst && worst.level !== 'ok' ? ` ${esc(worst.p.name)} is at <b>${worst.pct}%</b>.` : '';
  const tw = workoutOn(today), twSets = tw ? tw.entries.reduce((s, e) => s + (e.sets ? e.sets.length : 0), 0) : 0;
  const lilo = (tw ? `Workout done today${twSets ? `: <b>${twSets} sets</b>` : ''}. ` : 'No workout yet today. ') + `<b>${w} of ${target}</b> this week${w >= target ? ', target hit!' : '.'} Water <b>${waterToday()} of ${data.settings.waterTargetGlasses}</b>.`;
  let head = spent > pace ? 'A spendy day. Easy does it tonight.' : worst && worst.level === 'over' ? `${worst.p.name} is over budget.` : 'A calm day so far.';
  let next = due.length ? `Confirm <b>${esc(due[0].r.name)}</b> below so the pockets stay right.` : spent > pace ? `Skip extras for the rest of today to get back on pace.` : !tw && w < target ? `A gym session today keeps the week on track.` : `Log each purchase as it happens; it keeps the numbers honest.`;
  return { head, lily: lily + lilyExtra, lilo, next };
}
function afterSaveText(t) {
  const st = monthStats(), cat = catOf(t.categoryId);
  if (t.type === 'income') return { head: `${formatIDR(t.amount)} in. Nice.`, pts: [`This month: <b>${formatIDR(st.income)}</b> in, <b>${formatIDR(st.spent)}</b> spent.`], next: 'Confirm Kosan and Menanam Uang when they are due.' };
  const p = pocketOf(t.pocketId), s = pocketStatus(p, st), { pace, daysLeft } = dailyPace();
  const verb = t.type === 'refund' ? 'back into' : 'from';
  const pts = [`<b>${formatIDR(t.amount)}</b> for ${esc(cat.name)} ${verb} <b>${esc(p.name)}</b>.`];
  if (p.kind === 'save') pts.push(`Set aside this month: <b>${formatIDR(s.used)}</b> of <b>${formatIDR(p.budget)}</b>.`);

  else pts.push(`${esc(p.name)} is <b>${formatIDR(-s.left)}</b> over budget.`);
  const today = rangeSpent(todayStr(), todayStr()).spent;
  if (p.kind === 'spend') pts.push(`Today: <b>${formatIDR(today)}</b> of a <b>${formatIDR(pace)}</b> daily pace.`);
  const head = p.kind === 'save' ? 'Money planted. 🌱' : p.kind === 'bill' ? (s.left < 0 ? `${p.name} paid, a bit above budget.` : `${p.name} paid. One less thing.`) : s.level === 'over' ? `${p.name} is over budget.` : s.level === 'warn' ? `Careful: ${p.name} is at ${s.pct}%.` : 'Saved. All good.';
  const next = s.level === 'ok' || p.kind !== 'spend' ? '' : `About <b>${formatIDR(Math.max(0, s.left) / daysLeft)}</b> a day is left for ${esc(p.name)}.`;
  return { head, pts, next };
}

async function exportFile({ name, mime, text }) {

  const m = migrate(JSON.parse(JSON.stringify(v1)));

    ['Payday Feb 2027 = Fri 26 Feb (28th is Sunday)', dueDate(fakeRec, '2027-02') === '2027-02-26'],
    ['Backup file round-trip works', validateBackup(JSON.parse(JSON.stringify(data))) === null],
    ['CSV handles commas and quotes', toCSV([{ a: 'x, "y"' }], [{ label: 'a', get: r => r.a }]).includes('"x, ""y"""')],

    ['PR: heavier weight and more reps are both found', (() => { const h = [{ entries: [{ name: 'Bench', sets: [{ reps: 8, kg: 40 }] }] }];

  data.weights.push({ id: uid(), createdAt: new Date().toISOString(), date, kg });
  if (!save()) { data.weights = before; return; }
  closeSheet(); render(); toast('Weight saved');
}

/* =========================================================
   14. SETTINGS — budgets, salary, due days, backup, checks
   ========================================================= */
async function openSettings() {
  const tests = runSelfTest(), passed = tests.filter(t => t.pass).length;
  const rec = id => data.recurring.find(r => r.id === id) || {};
  openSheet(`<h3>Settings</h3>
<div class="card" style="gap:10px"><span class="lbl"><span>Pocket budgets (per month)</span><span></span></span>
${data.pockets.map(p => `<label class="field"><span>${esc(p.name)}</span><input inputmode="numeric" data-budget="${p.id}" value="${num(p.budget)}"></label>`).join('')}</div>
<div class="card" style="gap:10px"><span class="lbl"><span>Recurring</span><span>shown as "Due" cards</span></span>
<label class="field"><span>Salary amount (last working day)</span><input inputmode="numeric" data-recamt="rec_salary" value="${num(rec('rec_salary').amount || 0)}"></label>
<div class="grid2"><label class="field"><span>Kosan due day</span><input inputmode="numeric" data-recday="rec_kosan" value="${(rec('rec_kosan').schedule || {}).day || 1}"></label>
<label class="field"><span>Menanam Uang due day</span><input inputmode="numeric" data-recday="rec_invest" value="${(rec('rec_invest').schedule || {}).day || 1}"></label></div></div>
<div class="card" style="gap:10px"><span class="lbl"><span>Fitness</span><span></span></span>
<div class="grid2"><label class="field"><span>Workouts per week</span><input inputmode="numeric" id="setTarget" value="${data.settings.weeklyWorkoutTarget}"></label>
<label class="field"><span>Water glasses per day</span><input inputmode="numeric" id="setWater" value="${data.settings.waterTargetGlasses}"></label></div></div>
<button class="btn primary" data-act="saveSettings">Save settings</button>
<div class="card" style="gap:8px"><span class="lbl"><span>Backup</span><span>${data.transactions.length} money · ${data.workouts.length} workouts</span></span>
<div class="btns"><button class="btn small" data-export="json">Export backup</button><button class="btn small" data-export="transactions">Money CSV</button></div>
<button class="btn small" data-export="workouts">Workouts CSV</button>
<button class="btn small" data-act="import">Restore from backup…</button></div>
<div class="card" style="gap:6px"><span class="lbl"><span>App check</span><span class="${passed === tests.length ? 'c-mint' : 'c-red'}">${passed}/${tests.length} passed</span></span>
${tests.filter(t => !t.pass).map(t => `<span class="note c-red">✗ ${esc(t.name)}</span>`).join('')}
<span class="note">Storage: ${persisted === true ? '<span class="c-mint">protected from auto-clear</span>' : persisted === false ? '<span class="c-gold">not protected yet; add the app to your Home Screen</span>' : 'unknown'} · Data version ${data.schemaVersion}</span></div>
<button class="btn" data-act="close">Close</button>`);
}
function saveSettings() {
  const readNum = el => Number(String(el.value).replace(/\D/g, ''));
  const errs = [];
  document.querySelectorAll('[data-budget]').forEach(el => { const v = readNum(el); if (!v || v > 1e11) errs.push(`Budget for ${pocketOf(el.dataset.budget).name} must be more than 0.`); });
  document.querySelectorAll('[data-recday]').forEach(el => { const v = readNum(el); if (!(v >= 1 && v <= 31)) errs.push('Due day must be 1–31.'); });
  const sal = readNum(document.querySelector('[data-recamt]')); if (!sal) errs.push('Salary must be more than 0.');
  const tgt = readNum(document.getElementById('setTarget')), wat = readNum(document.getElementById('setWater'));
  if (!(tgt >= 1 && tgt <= 7)) errs.push('Workouts per week must be 1–7.');
  if (!(wat >= 1 && wat <= 20)) errs.push('Water glasses must be 1–20.');
  if (errs.length) return ask('Check the numbers', errs.join('\n'), 'OK', false, true);
  document.querySelectorAll('[data-budget]').forEach(el => pocketOf(el.dataset.budget).budget = readNum(el));
  document.querySelectorAll('[data-recday]').forEach(el => data.recurring.find(r => r.id === el.dataset.recday).schedule.day = readNum(el));
  data.recurring.find(r => r.id === 'rec_salary').amount = sal;
  const inv = data.recurring.find(r => r.id === 'rec_invest'); if (inv) inv.amount = pocketOf('pk_invest').budget;
  const kos = data.recurring.find(r => r.id === 'rec_kosan'); if (kos) kos.amount = pocketOf('pk_rent').budget;
  data.settings.weeklyWorkoutTarget = tgt; data.settings.waterTargetGlasses = wat;
  if (save()) { toast('Settings saved'); closeSheet(); render(); }
}

/* =========================================================
   15. EVENTS (one listener for everything)
   ========================================================= */
document.addEventListener('click', async e => {
  const el = e.target.closest('button, [data-go], [data-tx], [data-entry], [data-meal]'); if (!el) return;
  const ds = el.dataset;
  if (el.id === 'fab') return tab === 'Gym' ? openEx() : openAdd();
  if (ds.mode) return ds.mode === 'gym' ? openEx() : openAdd();
  if (ds.exsug) { readEx(); return pickEx(ds.exsug); }
  if (ds.muscle) { readEx(); exDraft.muscle = ds.muscle; exDraft.picked = true; return syncEx(); }
  if (ds.water) { addWater(Number(ds.water)); return render(); }
  if (ds.entry) return showEntry(ds.entry);
  if (ds.delentry) { const [wid, eid] = ds.delentry.split(':');
    if (await ask('Delete this exercise?', 'It is removed from that workout. This cannot be undone (except by restoring a backup).', 'Delete', true)) { if (deleteExercise(wid, eid)) { closeSheet(); render(); toast('Deleted'); } } return; }
  if (ds.meal) { const m = data.meals.find(x => x.id === ds.meal);
    if (m && await ask('Delete this meal?', `${m.name} · ${m.time}`, 'Delete', true)) { if (deleteRecord('meals', m.id)) { render(); toast('Deleted'); } } return; }
  if (ds.tab) { tab = ds.tab; showAll = false; render(); window.scrollTo(0, 0); return; }
  if (ds.go) { tab = ds.go; render(); window.scrollTo(0, 0); return; }
  if (ds.period) { moneyPeriod = ds.period; render(); return; }
  if (ds.tx) return showTx(ds.tx);
  if (ds.type) { draft.type = ds.type; drawAdd(); return; }
  if (ds.cat) { draft.categoryId = ds.cat; const c = catOf(ds.cat); if (c.pocketId) draft.pocketId = c.pocketId; drawAdd(); return; }
  if (ds.pocket) { draft.pocketId = ds.pocket; drawAdd(); return; }
  if (ds.due) { const r = data.recurring.find(x => x.id === ds.due), ym = todayStr().slice(0, 7);
    return openAdd({ type: r.type, amount: r.amount, categoryId: r.categoryId, pocketId: r.pocketId || 'pk_basic', note: r.name, date: dueDate(r, ym) <= todayStr() ? dueDate(r, ym) : todayStr(), recurringId: r.id }); }
  if (ds.skip) { const r = data.recurring.find(x => x.id === ds.skip);
    if (await ask(`Skip ${r.name} this month?`, 'It will not be added, and the reminder comes back next month.', 'Skip')) { skipRecurring(r.id, todayStr().slice(0, 7)); render(); } return; }
  if (ds.del) { const t = data.transactions.find(x => x.id === ds.del);
    if (await ask('Delete this entry?', `${t.note || catOf(t.categoryId).name} · ${formatIDR(t.amount)} · ${niceDate(t.date)}\n\nThis cannot be undone (except by restoring a backup).`, 'Delete', true)) {
      if (deleteRecord('transactions', t.id)) { closeSheet(); render(); toast('Deleted'); } } return; }
  if (ds.export) return exportFile(EXPORTS[ds.export]());
  switch (ds.act) {
    case 'close': return closeSheet();
    case 'saveTx': return saveTx();
    case 'addAnother': return openAdd();
    case 'settings': return openSettings();
    case 'saveSettings': return saveSettings();
    case 'import': return document.getElementById('importFile').click();
    case 'toggleAll': showAll = !showAll; return render();
    case 'addEx': return openEx();
    case 'saveEx': return saveEx();
    case 'addMeal': return openMeal();
    case 'saveMeal': return saveMeal();
    case 'logWeight': return openWeight();
    case 'saveWeight': return saveWeight();
  }
});
document.getElementById('importFile').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) importBackup(f); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && !document.querySelector('.overlay.open')) render(); });

/* =========================================================
   16. START
   ========================================================= */
load();
render();
askPersistentStorage().then(v => { persisted = v; });
</script>
</body>
</html>

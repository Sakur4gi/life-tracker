<style>
:root {
  --bg: #000000; --panel: #12151A; --panel2: #1B2027; --line: #20252D; --edge: #FFFFFF; --empty: #2A3039; --dim: #2A3039;
  --ink: #FFFFFF; --muted: #8D96A3; --soft: #C9CED6;
  --green: #2BD67B; --yellow: #F5C542; --red: #FF5A52; --blue: #4DA3FF; --gold: #F5C542; --mint: #2BD67B; --grey: #8D96A3;
  --disp: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --ease: cubic-bezier(.32, .72, 0, 1); --tabh: 76px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.4 Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-variant-numeric: tabular-nums; -webkit-text-size-adjust: 100%; overscroll-behavior-y: none; }
b { font-weight: 600; color: var(--ink); }
svg { display: block; flex: none; }
button { font: inherit; color: inherit; cursor: pointer; transition: transform .12s ease, background-color .15s ease, border-color .15s ease, color .15s ease; }
button:active { transform: scale(.96); }
input, select { font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; }
input:focus, select:focus { outline: none; border-color: var(--ink); }
.cap { font-family: var(--disp); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; font-size: 13px; color: var(--muted); }
.num { font-family: var(--disp); font-weight: 700; line-height: 1; white-space: nowrap; }
.av { border-radius: 50%; background: var(--panel2); display: flex; align-items: center; justify-content: center; flex: none; overflow: hidden; }

#screen { padding: calc(env(safe-area-inset-top) + 12px) 16px calc(var(--tabh) + env(safe-area-inset-bottom) + 96px); display: flex; flex-direction: column; gap: 12px; max-width: 520px; margin: 0 auto; }
.head { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 44px; }
.head .sub { display: none; }
.head h1 { margin: 0; font-family: var(--disp); font-size: 30px; line-height: 34px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }
.pill { padding: 7px 12px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); display: flex; align-items: center; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); display: flex; align-items: center; justify-content: center; color: var(--muted); }

.card { display: flex; flex-direction: column; gap: 12px; padding: 16px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); }
.card.strong, .card.coach { background: linear-gradient(160deg, #171C23 0%, var(--panel) 70%); }
.card.tap { cursor: pointer; transition: transform .12s ease; } .card.tap:active { transform: scale(.98); }
.sheet .card { background: var(--panel2); border-color: #262C35; }
.lbl { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.lbl > span:first-child { font-family: var(--disp); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; font-size: 13px; color: var(--muted); }
.lbl > span:last-child { font-size: 12px; color: var(--muted); text-align: right; }
.big { font-family: var(--disp); font-size: 30px; line-height: 1; font-weight: 700; white-space: nowrap; }
.big small { font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 400; color: var(--muted); }
.note { font-size: 12px; line-height: 16px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 14px; line-height: 20px; }
.blocks { display: flex; gap: 3px; } .blocks i { flex: 1; height: 6px; border-radius: 6px; background: var(--dim); }
.c-gold { color: var(--yellow); } .c-mint { color: var(--green); } .c-red { color: var(--red); } .c-blue { color: var(--blue); } .c-muted { color: var(--muted); }

.dials { display: flex; gap: 4px; }
.dial { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer; }
.ring { position: relative; display: flex; align-items: center; justify-content: center; flex: none; }
.ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.ring circle { transition: stroke-dasharray .6s var(--ease); }
.ring > span { display: flex; flex-direction: column; align-items: center; line-height: 1; text-align: center; }
.stat { display: flex; justify-content: space-between; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line); }
.stat:last-child { border-bottom: 0; padding-bottom: 2px; }
.stat > span:last-child { display: flex; align-items: baseline; gap: 8px; }
.bar { display: block; height: 6px; border-radius: 6px; background: var(--dim); } .bar i { display: block; height: 6px; border-radius: 6px; }
.vbars { display: flex; gap: 8px; align-items: flex-end; }
.vbars > span { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.vbars i { display: block; width: 100%; border-radius: 5px; }
.dots { display: flex; gap: 6px; } .dots i { width: 22px; height: 22px; border-radius: 50%; background: var(--dim); display: flex; align-items: center; justify-content: center; color: #000; font-size: 12px; font-weight: 700; font-style: normal; }
.insight { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 14px; background: var(--panel2); font-size: 13px; line-height: 19px; color: var(--soft); }
.seg { display: flex; padding: 4px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); }
.seg button { flex: 1; padding: 8px 0; border: 0; border-radius: 99px; background: transparent; }
.seg button.on { background: var(--ink); } .seg button.on .cap { color: #000; }

.coachhead { display: flex; align-items: center; gap: 10px; }
.coachhead .avs { display: flex; } .coachhead .avs .av + .av { margin-left: -10px; box-shadow: 0 0 0 2px var(--panel); }
.headline { font-size: 18px; line-height: 24px; font-weight: 600; }
.coach p { margin: 0; font-size: 14px; line-height: 21px; color: var(--soft); }

.item { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); cursor: pointer; }
.item .ic { width: 38px; height: 38px; border-radius: 12px; background: var(--panel2); display: flex; align-items: center; justify-content: center; flex: none; }
.item .t { font-size: 15px; line-height: 20px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .s { font-size: 12px; line-height: 16px; color: var(--muted); }
.item .a { font-size: 15px; font-weight: 600; white-space: nowrap; }
.pocket { display: flex; flex-direction: column; gap: 8px; padding: 14px 0; border-top: 1px solid var(--line); }
.hbar { display: flex; align-items: center; gap: 10px; font-size: 13px; line-height: 18px; }
.hbar .n { width: 92px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .b { flex: 1; height: 6px; border-radius: 6px; background: var(--dim); } .hbar .b i { display: block; height: 6px; border-radius: 6px; background: var(--green); }
.hbar .v { width: 84px; text-align: right; color: var(--muted); }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { padding: 9px 14px; min-height: 40px; border: 1px solid var(--line); border-radius: 99px; background: var(--panel); color: var(--soft); font-size: 14px; font-weight: 500; }
.sheet .chip { background: var(--panel2); }
.chip.on { background: var(--ink); color: #000; border-color: var(--ink); font-weight: 600; }
.btn { height: 54px; border: 1px solid #3A414C; border-radius: 99px; background: transparent; color: var(--ink); padding: 0 18px; font-family: var(--disp); font-size: 17px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.btn.primary { background: var(--ink); color: #000; border-color: var(--ink); }
.btn.danger { border-color: var(--red); color: var(--red); }
.btn.small { height: 42px; font-size: 14px; }
.due { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px; border: 1px dashed var(--yellow); border-radius: 18px; background: var(--panel); }
.due .t { font-size: 15px; font-weight: 500; } .due .s { font-size: 12px; color: var(--muted); } .due .acts { display: flex; gap: 6px; flex: none; }

.week { display: flex; justify-content: space-between; }
.day { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.day i { width: 38px; height: 38px; border-radius: 50%; background: var(--dim); display: flex; align-items: center; justify-content: center; font-style: normal; font-weight: 700; color: #000; }
.day.done i { background: var(--blue); } .day.today:not(.done) i { background: transparent; box-shadow: inset 0 0 0 2px var(--ink); }
.day.today .cap { color: var(--ink); }
.herobox { display: flex; justify-content: center; align-items: flex-end; gap: 2px; padding: 4px 0; }
.mrow { display: flex; align-items: center; gap: 10px; font-size: 14px; line-height: 20px; }
.mrow i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.mrow span:nth-child(2) { flex: 1; } .mrow span:nth-child(3) { color: var(--muted); font-size: 12px; }
.tag { padding: 3px 8px; border-radius: 99px; background: var(--yellow); color: #000; font-family: var(--disp); font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: .08em; white-space: nowrap; }
.step { width: 52px; height: 52px; border-radius: 50%; border: 1px solid #3A414C; background: transparent; font-size: 24px; font-weight: 600; }
.step.plus { border: 0; background: var(--blue); color: #000; }

#tabs { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--tabh) + env(safe-area-inset-bottom)); padding: 10px 10px env(safe-area-inset-bottom);
  display: flex; align-items: flex-start; background: #07090BF2; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--line); z-index: 3; }
#tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; background: transparent; color: #6B7480; }
#tabs button .cap { color: inherit; font-size: 12px; } #tabs button.on { color: var(--ink); }
#fab { position: fixed; right: 18px; bottom: calc(var(--tabh) + env(safe-area-inset-bottom) + 16px); width: 58px; height: 58px; z-index: 4; border: 0; border-radius: 50%;
  background: var(--ink); color: #000; font-size: 30px; line-height: 1; font-weight: 500; box-shadow: 0 8px 24px #000a; }

.overlay { position: fixed; inset: 0; background: #000c; display: flex; align-items: flex-end; justify-content: center; z-index: 10; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .28s ease, visibility 0s linear .38s; }
.overlay.open { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity .28s ease; }
.overlay .sheet { transform: translateY(100%); transition: transform .42s var(--ease); will-change: transform; }
.overlay.open .sheet { transform: none; }
.sheet { width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 26px 26px 0 0;
  padding: 20px 16px calc(env(safe-area-inset-bottom) + 20px); display: flex; flex-direction: column; gap: 14px; }
.sheet h3 { margin: 0; font-family: var(--disp); font-size: 26px; line-height: 30px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }
.sheet .msg { margin: 0; color: var(--soft); white-space: pre-line; font-size: 14px; line-height: 20px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 12px; color: var(--muted); }
.field input, .field select { height: 50px; padding: 0 14px; width: 100%; }
.amount { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.amount span { font-family: var(--disp); font-size: 30px; font-weight: 700; color: var(--muted); }
.amount input { border: 0; background: transparent; font-family: var(--disp); font-size: 44px; font-weight: 700; width: 100%; padding: 0; height: 54px; border-radius: 0; }
.err { color: var(--red); font-size: 13px; white-space: pre-line; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.swap > * { animation: swap .28s var(--ease) both; }
@keyframes swap { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
#screen.enter > * { animation: enter .32s var(--ease) both; }
#screen.enter > :nth-child(2) { animation-delay: .03s; } #screen.enter > :nth-child(3) { animation-delay: .06s; }
#screen.enter > :nth-child(4) { animation-delay: .09s; } #screen.enter > :nth-child(n+5) { animation-delay: .12s; }
@keyframes enter { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.prstage { position: relative; height: 226px; overflow: hidden; }
.prf { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; align-items: flex-end; opacity: 0; transition: opacity .2s linear; transform-origin: 50% 85%; }
.prf.on { opacity: 1; } .prf.pop { animation: pop .5s cubic-bezier(.34, 1.56, .64, 1); }
@keyframes pop { from { transform: scale(.82); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .overlay, .overlay .sheet, .prf, .ring circle { transition: none; } .swap > *, #screen.enter > *, .prf.pop { animation: none; } }
#banner { display: none; background: #3A1519; color: #fff; padding: 12px 14px; font-weight: 600; font-size: 14px; border: 1px solid var(--red); border-radius: 14px; }
#toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 12px); transform: translate(-50%, -16px); z-index: 20; background: var(--ink); color: #000; border-radius: 99px; padding: 10px 18px; font-size: 14px; font-weight: 600;
  opacity: 0; transition: opacity .25s ease, transform .35s var(--ease); pointer-events: none; max-width: 90vw; text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
.empty { text-align: center; color: var(--muted); font-size: 13px; padding: 12px 0; }
</style>
</head>

</div></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

/* =========================================================
   1. CONFIG
   ========================================================= */
const STORAGE_KEY = 'lifetracker.v1';           // main save (name kept so Step 1 data carries over)
const PREVIOUS_KEY = 'lifetracker.v1.previous'; // copy of the save before the latest change
const SCHEMA_VERSION = 3;
const COLLECTIONS = ['pockets', 'categories', 'transactions', 'recurring', 'savingsGoals', 'workoutTypes', 'workouts', 'weights', 'reports', 'exercises', 'meals'];
const POCKET_COLORS = { pk_basic: '#7FB4F0', pk_invest: '#8FE0B0', pk_fun: '#F2C66D', pk_rent: '#B4B1C6' };

/* =========================================================
   2. SMALL HELPERS
   ========================================================= */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
// Local date YYYY-MM-DD (not toISOString, which is UTC = yesterday before 7am in Jakarta)
function todayStr(d = new Date()) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function parseDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function isValidDateStr(s) {
  if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const [y, m, d] = s.split('-').map(Number); const dt = new Date(y, m - 1, d);
  return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;
}
function formatIDR(n) { return (n < 0 ? '-' : '') + 'Rp ' + Math.abs(Math.round(n)).toLocaleString('id-ID'); }
function num(n) { return Math.round(n).toLocaleString('id-ID'); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
function niceDate(s) { const d = parseDate(s); return d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0, 3); }
function daysInMonth(y, m0) { return new Date(y, m0 + 1, 0).getDate(); }

function weekStart(d = new Date()) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function blocks(on, n, color, sq = false) {
  on = Math.max(0, Math.min(n, on));
  return `<span class="blocks${sq ? ' sq' : ''}">` + Array.from({ length: n }, (_, i) => `<i${i < on ? ` style="background:${color}"` : ''}></i>`).join('') + '</span>';
}

// Upgrades older saves without losing anything
function migrate(obj) {
  if (!obj || typeof obj !== 'object') throw new Error('Not a Life Tracker save');
  if ((obj.schemaVersion || 0) > SCHEMA_VERSION) throw new Error('This backup is from a newer version of the app');
  const base = defaultData();
  const out = { ...base, ...obj, settings: { ...base.settings, ...(obj.settings || {}) } };
  out.settings.ai = { ...base.settings.ai, ...((obj.settings || {}).ai || {}) };
  for (const key of COLLECTIONS) if (!Array.isArray(out[key])) out[key] = base[key];
  if ((obj.schemaVersion || 1) < 2) {
    // v1 → v2: add pockets, new categories, give each old expense a pocket, add salary/kosan/invest reminders
    out.pockets = base.pockets;
    const have = new Set(out.categories.map(c => c.id));
    for (const c of base.categories) if (!have.has(c.id)) out.categories.push(c);
    for (const c of out.categories) {
      const def = base.categories.find(b => b.id === c.id);
      if (c.type === 'expense' && !c.pocketId) c.pocketId = def ? def.pocketId : 'pk_basic';
      if (c.type === 'income') c.pocketId = null;
      delete c.emoji;
    }
    for (const t of out.transactions) {
      if (t.type !== 'income' && !t.pocketId) t.pocketId = (out.categories.find(c => c.id === t.categoryId) || {}).pocketId || 'pk_basic';
      if (t.type === 'income') t.pocketId = null;
    }
    if (!out.recurring.length) out.recurring = base.recurring;
  }
  if (!out.water || typeof out.water !== 'object' || Array.isArray(out.water)) out.water = {};
  out.schemaVersion = SCHEMA_VERSION;
  return out;
}
function validateBackup(obj) {
  if (!obj || typeof obj !== 'object') return 'File is not a Life Tracker backup.';
  if (typeof obj.schemaVersion !== 'number') return 'File is missing the version number — not a Life Tracker backup.';
  for (const key of ['categories', 'transactions', 'workouts', 'weights']) if (!Array.isArray(obj[key])) return `Backup is missing "${key}".`;
  if (obj.schemaVersion > SCHEMA_VERSION) return 'This backup is from a newer version of the app.';
  return null;
}

/* =========================================================
   4. STORAGE — save on every change, keep the previous save
   ========================================================= */
let data;
function load() {
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); }
  catch (e) { data = defaultData(); showBanner('⚠️ This browser is blocking storage. Nothing will be saved. Open the app from the Home Screen icon.'); return; }
  if (!raw) { data = defaultData(); save(); return; }
  try {
    const parsed = JSON.parse(raw);
    const wasOld = (parsed.schemaVersion || 1) < SCHEMA_VERSION;
    data = migrate(parsed);
    if (wasOld) save();
  } catch (e) {
    try { data = migrate(JSON.parse(localStorage.getItem(PREVIOUS_KEY))); showBanner('Main save was unreadable, so the previous save was restored.'); save(); }
    catch (e2) { data = defaultData(); data.__doNotOverwrite = true; showBanner('⚠️ Saved data could not be read. Restore from a backup file in Settings. (Nothing was overwritten yet.)'); }
  }
}
function save() {
  if (data.__doNotOverwrite) delete data.__doNotOverwrite;
  data.updatedAt = new Date().toISOString();
  try {
    const current = localStorage.getItem(STORAGE_KEY);
    if (current) localStorage.setItem(PREVIOUS_KEY, current);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return true;
  } catch (e) { showBanner('⚠️ Could not save! Storage may be full. Export a backup now (Settings).'); return false; }
}
let persisted = null;
async function askPersistentStorage() {
  try { if (navigator.storage && navigator.storage.persist) return (await navigator.storage.persisted()) || (await navigator.storage.persist()); } catch (e) {}
  return null;
}

/* =========================================================
   5. VALIDATION — errors block saving, warnings ask first
   ========================================================= */
function validateTransaction(t, d = data) {
  const errors = [], warnings = [];
  if (!['expense', 'income', 'refund'].includes(t.type)) errors.push('Type must be expense, income or refund.');
  if (typeof t.amount !== 'number' || !Number.isFinite(t.amount)) errors.push('Enter an amount.');
  else {
    if (t.amount <= 0) errors.push('Amount must be more than 0. For money back, use "Refund".');
    else if (!Number.isInteger(t.amount)) errors.push('Rupiah amounts have no decimals.');
    if (t.amount > 1e11) errors.push('Amount looks too large.');
  }
  const cat = d.categories.find(c => c.id === t.categoryId);
  if (!cat) errors.push('Pick a category.');
  else if (cat.type !== (t.type === 'income' ? 'income' : 'expense')) errors.push(`"${cat.name}" is not an ${t.type === 'income' ? 'income' : 'expense'} category.`);
  if (t.type !== 'income' && !d.pockets.find(p => p.id === t.pocketId)) errors.push('Pick a pocket.');
  if (!isValidDateStr(t.date)) errors.push('Date is not valid.');
  else if (t.date > todayStr()) warnings.push('This date is in the future.');
  if (t.note && t.note.length > 200) errors.push('Note is too long (max 200 characters).');
  if (!errors.length && t.type === 'expense' && t.amount >= 5000000) warnings.push(`${formatIDR(t.amount)} is a big amount. Is it right?`);
  return { errors, warnings };
}
function validateWorkout(w, d = data) {
  const errors = [], warnings = [];
  if (!d.workoutTypes.find(x => x.id === w.typeId)) errors.push('Pick a workout type.');
  if (!Number.isInteger(w.durationMin) || w.durationMin < 1 || w.durationMin > 600) errors.push('Duration must be 1–600 minutes.');
  if (!isValidDateStr(w.date)) errors.push('Date is not valid.'); else if (w.date > todayStr()) warnings.push('This workout date is in the future.');
  return { errors, warnings };
}
function validateWeight(x) {
  const errors = [], warnings = [];
  if (typeof x.kg !== 'number' || !Number.isFinite(x.kg) || x.kg < 20 || x.kg > 350) errors.push('Weight must be between 20 and 350 kg.');
  if (!isValidDateStr(x.date)) errors.push('Date is not valid.'); else if (x.date > todayStr()) warnings.push('This date is in the future.');
  return { errors, warnings };
}
const VALIDATORS = { transactions: validateTransaction, workouts: validateWorkout, weights: validateWeight };

/* =========================================================
   6. ACTIONS — the only functions that change data
   ========================================================= */
function addRecord(collection, record, { force = false } = {}) {
  const check = VALIDATORS[collection](record);
  if (check.errors.length) return { ok: false, ...check };
  if (check.warnings.length && !force) return { ok: false, needsConfirm: true, ...check };
  const full = { id: uid(), createdAt: new Date().toISOString(), ...record };
  data[collection].push(full);
  if (record.recurringId) { const r = data.recurring.find(x => x.id === record.recurringId); if (r) r.lastDoneMonth = record.date.slice(0, 7); }
  if (!save()) { data[collection].pop(); return { ok: false, errors: ['Save failed.'], warnings: [] }; }
  return { ok: true, record: full, errors: [], warnings: [] };
}
function deleteRecord(collection, id) {
  const i = data[collection].findIndex(r => r.id === id);
  if (i < 0) return false;
  const [removed] = data[collection].splice(i, 1);
  if (!save()) { data[collection].splice(i, 0, removed); return false; }
  return true;
}
function skipRecurring(id, ym) { const r = data.recurring.find(x => x.id === id); if (!r) return; r.lastDoneMonth = ym; save(); }

/* =========================================================
   7. CALCULATIONS
   ========================================================= */
const pocketOf = id => data.pockets.find(p => p.id === id);
const catOf = id => data.categories.find(c => c.id === id);
function signed(t) { return t.type === 'refund' ? -t.amount : t.amount; }

function monthStats(ym = todayStr().slice(0, 7)) {
  let income = 0, spent = 0, saved = 0;
  const byPocket = {}, byCat = {};
  for (const p of data.pockets) byPocket[p.id] = 0;
  for (const t of data.transactions) {
    if (!t.date.startsWith(ym)) continue;
    if (t.type === 'income') { income += t.amount; continue; }
    const v = signed(t), p = pocketOf(t.pocketId);
    byPocket[t.pocketId] = (byPocket[t.pocketId] || 0) + v;
    if (p && p.kind === 'save') saved += v;
    else { spent += v; byCat[t.categoryId] = (byCat[t.categoryId] || 0) + v; }
  }
  return { income, spent, saved, left: income - spent - saved, byPocket, byCat };
}
function rangeSpent(from, to) { // spending (not savings) between two date strings, inclusive
  let s = 0, n = 0;
  for (const t of data.transactions) {
    if (t.type === 'income' || t.date < from || t.date > to) continue;
    const p = pocketOf(t.pocketId); if (p && p.kind === 'save') continue;
    s += signed(t); n++;
  }
  return { spent: s, count: n };
}
// Daily allowance = what is left in the spend pockets (Basic + Foya-Foya) at the start of today ÷ days left (incl. today)
function dailyPace(today = todayStr()) {
  const ym = today.slice(0, 7), d = parseDate(today);
  const daysLeft = daysInMonth(d.getFullYear(), d.getMonth()) - d.getDate() + 1;
  let budget = 0, spentBefore = 0;
  for (const p of data.pockets) if (p.kind === 'spend') budget += p.budget;
  for (const t of data.transactions) {
    if (t.type === 'income' || !t.date.startsWith(ym) || t.date >= today) continue;
    const p = pocketOf(t.pocketId); if (p && p.kind === 'spend') spentBefore += signed(t);
  }
  return { pace: Math.max(0, Math.round((budget - spentBefore) / daysLeft)), daysLeft };
}
function pocketStatus(p, st) {
  const used = st.byPocket[p.id] || 0, pct = p.budget ? Math.round(used / p.budget * 100) : 0;
  const warn = data.settings.budgetWarningPct;
  return { used, left: p.budget - used, pct, level: pct >= 100 ? 'over' : pct >= warn ? 'warn' : 'ok' };
}
function dueDate(r, ym) {
  const [y, m] = ym.split('-').map(Number);
  if (r.schedule.kind === 'lastWorkingDay') return lastWorkingDay(y, m - 1);
  return ym + '-' + String(Math.min(r.schedule.day, daysInMonth(y, m - 1))).padStart(2, '0');
}
function dueItems(today = todayStr()) {
  const ym = today.slice(0, 7);
  return data.recurring.filter(r => r.active && r.lastDoneMonth !== ym && dueDate(r, ym) <= today).map(r => ({ r, date: dueDate(r, ym) }));
}
function nextPayday(today = todayStr()) {
  const d = parseDate(today); let p = lastWorkingDay(d.getFullYear(), d.getMonth());
  if (p < today) p = lastWorkingDay(d.getFullYear(), d.getMonth() + 1);
  return { date: p, days: Math.round((parseDate(p) - parseDate(today)) / 864e5) };
}
function workoutsThisWeek() {
  const from = todayStr(weekStart()), to = todayStr();
  return new Set(data.workouts.filter(w => w.date >= from && w.date <= to).map(w => w.date)).size;
}

/* =========================================================
   8. LILY & LILO — free, rule-based narrative summaries
   Format: headline, 2–3 key points with bold numbers, one next step.
   ========================================================= */
function spendPocketsWorst(st) {
  return data.pockets.filter(p => p.kind === 'spend').map(p => ({ p, ...pocketStatus(p, st) })).sort((a, b) => b.pct - a.pct)[0];
}

const MUSCLES = ['Chest', 'Back', 'Shoulders', 'Biceps', 'Triceps', 'Core', 'Legs', 'Cardio'];
const TIER_COL = ['#3A3A50', '#BDEBCF', '#5FCF93', '#F7C95A', '#FF7564'];

function tierOf(sets) { return sets >= 12 ? 4 : sets >= 8 ? 3 : sets >= 4 ? 2 : sets >= 1 ? 1 : 0; }
function guessMuscle(name) {

    ['Legs', /squat|leg|lunge|calf|calves|hip thrust|glute|hamstring|quad/], ['Triceps', /tricep|dip|pushdown|skull/],
    ['Biceps', /curl|bicep|chin-up|chin up/], ['Shoulders', /shoulder|overhead|ohp|lateral|military|face pull|arnold/],
    ['Core', /plank|crunch|sit-up|sit up|abs|ab wheel|russian|leg raise|core/], ['Back', /pull|row|lat|deadlift|back/], ['Chest', /bench|push-up|push up|pushup|chest|fly|pec/]];
  for (const [m, re] of rules) if (re.test(n)) return m;
  return '';
}
const fmtNum = v => String(v).replace('.', ',');
const toNum = v => { const s = String(v ?? '').trim().replace(',', '.'); return s === '' ? NaN : Number(s); };
function entryText(e) {
  if (!e.sets) return `${e.minutes} min${e.km ? ' · ' + fmtNum(e.km) + ' km' : ''}`;
  const s0 = e.sets[0];
  return `${e.sets.length} × ${s0.reps} · ${s0.kg ? fmtNum(s0.kg) + ' kg' : 'bodyweight'}`;
}
function workoutOn(date) { return data.workouts.find(w => w.date === date && Array.isArray(w.entries)); }
function latestWorkout() { return [...data.workouts].filter(w => (w.entries || []).length).sort(byDate).pop(); }
function musclesOf(w) { const m = {}; for (const e of (w && w.entries) || []) if (e.sets) m[e.muscle] = (m[e.muscle] || 0) + e.sets.length; return m; }
function tiersOf(w) { const t = {}, m = musclesOf(w); for (const k in m) t[k] = tierOf(m[k]); return t; }
const TIER_FILL = ['#FFFFFF', '#BDEBCF', '#5FCF93', '#F7C95A', '#FF7564'];
// Heroic Lilo: the drawing has a colour slot per muscle group, filled here from today's tiers
function heroSvg(view, tiers, w = 158, tpl) {
  let s = tpl || SPRITES.hero[view];
  for (const m of MUSCLES) s = s.split('@' + m + '@').join(TIER_FILL[(tiers || {})[m] || 0]);
  return s.replace('width="268" height="314"', `width="${w}" height="${Math.round(w * 314 / 268)}"`);
}
function weekStreak() { // weeks in a row that hit the weekly target
  const target = data.settings.weeklyWorkoutTarget, days = new Set(data.workouts.map(w => w.date));
  const count = ws => { let n = 0; for (let i = 0; i < 7; i++) { const d = new Date(ws); d.setDate(d.getDate() + i); if (days.has(todayStr(d))) n++; } return n; };
  let ws = weekStart(), streak = count(ws) >= target ? 1 : 0;

}
// PR = heavier than ever before for this exercise, or more reps than ever at the same weight. The first time sets the baseline.
function findPRs(entry, workouts = data.workouts) {
  if (!entry.sets) return [];
  const key = entry.name.toLowerCase(), prev = [];
  for (const w of workouts) for (const x of (w.entries || [])) if (x.sets && x.name.toLowerCase() === key) prev.push(...x.sets);
  if (!prev.length) return [];
  const { kg, reps } = entry.sets[0], out = [];
  if (kg > Math.max(...prev.map(s => s.kg))) out.push('weight');
  const same = prev.filter(s => s.kg === kg);

function validateExercise(e) {

  const readNum = el => Number(String(el.value).replace(/\D/g, ''));
  const errs = [];
  document.querySelectorAll('[data-budget]').forEach(el => { const v = readNum(el); if (!v || v > 1e11) errs.push(`Budget for ${pocketOf(el.dataset.budget).name} must be more than 0.`); });
  document.querySelectorAll('[data-recday]').forEach(el => { const v = readNum(el); if (!(v >= 1 && v <= 31)) errs.push('Due day must be 1–31.'); });
  const sal = readNum(document.querySelector('[data-recamt]')); if (!sal) errs.push('Salary must be more than 0.');
  const tgt = readNum(document.getElementById('setTarget')), wat = readNum(document.getElementById('setWater'));
  if (!(tgt >= 1 && tgt <= 7)) errs.push('Workouts per week must be 1–7.');
  if (!(wat >= 1 && wat <= 20)) errs.push('Water glasses must be 1–20.');
  if (errs.length) return ask('Check the numbers', errs.join('\n'), 'OK', false, true);
  document.querySelectorAll('[data-budget]').forEach(el => pocketOf(el.dataset.budget).budget = readNum(el));
  document.querySelectorAll('[data-recday]').forEach(el => data.recurring.find(r => r.id === el.dataset.recday).schedule.day = readNum(el));
  data.recurring.find(r => r.id === 'rec_salary').amount = sal;
  const inv = data.recurring.find(r => r.id === 'rec_invest'); if (inv) inv.amount = pocketOf('pk_invest').budget;
  const kos = data.recurring.find(r => r.id === 'rec_kosan'); if (kos) kos.amount = pocketOf('pk_rent').budget;
  data.settings.weeklyWorkoutTarget = tgt; data.settings.waterTargetGlasses = wat;
  if (save()) { toast('Settings saved'); closeSheet(); render(); }
}

/* =========================================================
   15. EVENTS (one listener for everything)
   ========================================================= */
document.addEventListener('click', async e => {
  const el = e.target.closest('button, [data-go], [data-tx], [data-entry], [data-meal]'); if (!el) return;
  const ds = el.dataset;
  if (el.id === 'fab') return tab === 'Gym' ? openEx() : tab === 'Fuel' ? openMeal() : openAdd();
  if (ds.mode) return ds.mode === 'gym' ? openEx() : ds.mode === 'meal' ? openMeal() : openAdd();
  if (ds.fav) return quickMeal(ds.fav);
  if (ds.exsug) { readEx(); return pickEx(ds.exsug); }
  if (ds.muscle) { readEx(); exDraft.muscle = ds.muscle; exDraft.picked = true; return syncEx(); }
  if (ds.water) { addWater(Number(ds.water)); return render(); }
  if (ds.entry) return showEntry(ds.entry);
  if (ds.delentry) { const [wid, eid] = ds.delentry.split(':');
    if (await ask('Delete this exercise?', 'It is removed from that workout. This cannot be undone (except by restoring a backup).', 'Delete', true)) { if (deleteExercise(wid, eid)) { closeSheet(); render(); toast('Deleted'); } } return; }
  if (ds.meal) { const m = data.meals.find(x => x.id === ds.meal);
    if (m && await ask('Delete this meal?', `${m.name} · ${m.time}`, 'Delete', true)) { if (deleteRecord('meals', m.id)) { render(); toast('Deleted'); } } return; }
  if (ds.tab) return go(ds.tab);
  if (ds.go) return go(ds.go);
  if (ds.period) { moneyPeriod = ds.period; render(); return; }
  if (ds.tx) return showTx(ds.tx);
  if (ds.type) { draft.type = ds.type; drawAdd(); return; }
  if (ds.cat) { draft.categoryId = ds.cat; const c = catOf(ds.cat); if (c.pocketId) draft.pocketId = c.pocketId; drawAdd(); return; }
  if (ds.pocket) { draft.pocketId = ds.pocket; drawAdd(); return; }
  if (ds.due) { const r = data.recurring.find(x => x.id === ds.due), ym = todayStr().slice(0, 7);
    return openAdd({ type: r.type, amount: r.amount, categoryId: r.categoryId, pocketId: r.pocketId || 'pk_basic', note: r.name, date: dueDate(r, ym) <= todayStr() ? dueDate(r, ym) : todayStr(), recurringId: r.id }); }
  if (ds.skip) { const r = data.recurring.find(x => x.id === ds.skip);
    if (await ask(`Skip ${r.name} this month?`, 'It will not be added, and the reminder comes back next month.', 'Skip')) { skipRecurring(r.id, todayStr().slice(0, 7)); render(); } return; }
  if (ds.del) { const t = data.transactions.find(x => x.id === ds.del);
    if (await ask('Delete this entry?', `${t.note || catOf(t.categoryId).name} · ${formatIDR(t.amount)} · ${niceDate(t.date)}\n\nThis cannot be undone (except by restoring a backup).`, 'Delete', true)) {
      if (deleteRecord('transactions', t.id)) { closeSheet(); render(); toast('Deleted'); } } return; }
  if (ds.export) return exportFile(EXPORTS[ds.export]());
  switch (ds.act) {
    case 'close': return closeSheet();
    case 'saveTx': return saveTx();
    case 'addAnother': return openAdd();
    case 'settings': return openSettings();
    case 'saveSettings': return saveSettings();
    case 'import': return document.getElementById('importFile').click();
    case 'toggleAll': showAll = !showAll; return render();
    case 'addEx': return openEx();
    case 'seeWeek': { const w = document.getElementById('weekCard'); if (w) w.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    case 'saveEx': return saveEx();
    case 'addMeal': return openMeal();
    case 'saveMeal': return saveMeal();
    case 'logWeight': return openWeight();
    case 'saveWeight': return saveWeight();
  }
});
document.getElementById('importFile').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) importBackup(f); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && !document.querySelector('.overlay.open')) render(); });

/* =========================================================
   16. START
   ========================================================= */
load();
render();
askPersistentStorage().then(v => { persisted = v; });
</script>
</body>
</html>
